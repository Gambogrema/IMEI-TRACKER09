<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMEI-TRACKER09</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding: 30px 15px;
        }    .container {
        max-width: 450px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 2px 10px #cccccc;
    }

    h1 {
        color: #163a70;
    }

    input, button {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-top: 12px;
        font-size: 16px;
        border-radius: 6px;
    }

    input {
        border: 1px solid #cccccc;
    }

    button {
        background: #1769aa;
        color: white;
        border: none;
        cursor: pointer;
    }

    #resultat {
        margin-top: 20px;
        overflow-wrap: anywhere;
    }
</style>

</head>
<body>
    <div class="container">
        <h1>IMEI-TRACKER09</h1>
        <p>Vérification du numéro IMEI d'un téléphone</p>    <form id="formulaire">
        <input
            type="text"
            id="imei"
            placeholder="Entrez votre numéro IMEI"
            inputmode="numeric"
            maxlength="15"
            required
        >
        <button type="submit">Vérifier l'IMEI</button>
    </form>

    <div id="resultat" aria-live="polite"></div>
</div>

<script>
    document.getElementById("formulaire").addEventListener("submit", function(event) {
        event.preventDefault();

        const imei = document.getElementById("imei").value.trim();
        const resultat = document.getElementById("resultat");

        if (!/^\d{15}$/.test(imei)) {
            resultat.textContent = "Veuillez saisir un IMEI de 15 chiffres.";
            return;
        }

        let somme = 0;

        for (let i = 0; i < 15; i++) {
            let chiffre = Number(imei[i]);

            if (i % 2 === 1) {
                chiffre *= 2;
                if (chiffre > 9) chiffre -= 9;
            }

            somme += chiffre;
        }

        if (somme % 10 === 0) {
            resultat.textContent =
                "Le format et la clé de contrôle de cet IMEI sont valides. Cela ne confirme pas l'identité du téléphone ni son statut.";
        } else {
            resultat.textContent =
                "La clé de contrôle de cet IMEI est invalide. Vérifiez le numéro saisi.";
        }
    });
</script>

</body>
</html>
